apiVersion: v1
kind: Pod
metadata:
  name: nginx-with-init
spec:
  volumes:
  - name: config-volume
    emptyDir: {}  # Shared volume between init and main container

  initContainers:
  - name: init-config
    image: busybox
    command: ['sh', '-c', 'echo "Welcome to Nginx!" > /config/index.html']
    volumeMounts:
    - name: config-volume
      mountPath: /config

  containers:
  - name: nginx-container
    image: nginx
    volumeMounts:
    - name: config-volume
      mountPath: /usr/share/nginx/html
    ports:
    - containerPort: 80
